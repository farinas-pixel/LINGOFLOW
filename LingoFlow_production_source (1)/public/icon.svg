<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B5FEF"/>
      <stop offset="50%" stop-color="#7C83FF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="flow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#5B5FEF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Orbital rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#5B5FEF" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="10 10"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Interlocking translation flow loops -->
  <path d="M128 192 C128 140 170 96 224 96 H272 C338 96 392 150 392 216 C392 248 368 276 336 276 H240 C178 276 128 226 128 192 Z"
        fill="none" stroke="url(#flow1)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M384 320 C384 372 342 416 288 416 H240 C174 416 120 362 120 296 C120 264 144 236 176 236 H272 C334 236 384 286 384 320 Z"
        fill="none" stroke="url(#flow2)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Core luminous nexus -->
  <circle cx="256" cy="256" r="32" fill="#080B14" stroke="#22D3EE" stroke-width="6"/>
  <circle cx="256" cy="256" r="16" fill="#22D3EE"/>
</svg>
